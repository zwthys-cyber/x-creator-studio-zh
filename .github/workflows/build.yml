name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile iOS dynamic library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for ARCH in arm64 arm64e; do
            xcrun --sdk iphoneos clang -arch "$ARCH" -isysroot "$SDK" \
              -miphoneos-version-min=15.0 -fobjc-arc -fmodules \
              -Wall -Wextra -Werror -dynamiclib src/XCreatorStudioZH.m \
              -framework Foundation -framework UIKit -framework WebKit -framework QuartzCore \
              -install_name @rpath/XCreatorStudioZH.dylib \
              -o "dist/plugin-$ARCH.dylib"
          done
          xcrun lipo -create dist/plugin-arm64.dylib dist/plugin-arm64e.dylib -output dist/XCreatorStudioZH.dylib
          rm dist/plugin-arm64.dylib dist/plugin-arm64e.dylib
      - name: Inspect architecture and ad hoc signature
        run: |
          set -euo pipefail
          xcrun lipo dist/XCreatorStudioZH.dylib -verify_arch arm64 arm64e
          codesign --force --sign - dist/XCreatorStudioZH.dylib
          codesign --verify --strict dist/XCreatorStudioZH.dylib
          file dist/XCreatorStudioZH.dylib
          cp README.md dist/
          echo "$GITHUB_SHA" > dist/SOURCE_COMMIT
          cd dist
          shasum -a 256 XCreatorStudioZH.dylib > SHA256SUMS
      - name: Run synthetic iOS UI and WebKit fixtures
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          mkdir -p fixture.app
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          ARCH="$(uname -m)"
          xcrun --sdk iphonesimulator clang -arch "$ARCH" -isysroot "$SDK" \
            -mios-simulator-version-min=15.0 -fobjc-arc -fmodules \
            tests/FixtureApp.m -framework UIKit -framework Foundation \
            -framework WebKit -framework QuartzCore -o fixture.app/Fixture
          python3 -c 'import plistlib; plistlib.dump(dict(CFBundleExecutable="Fixture", CFBundleIdentifier="dev.xcszh.fixture", CFBundleName="Fixture", CFBundlePackageType="APPL", CFBundleVersion="1", CFBundleShortVersionString="0.2", LSRequiresIPhoneOS=True, UIDeviceFamily=[1,2], UILaunchScreen={}), open("fixture.app/Info.plist","wb"))'
          codesign --force --sign - fixture.app
          xcrun simctl install "$DEVICE" fixture.app
          xcrun simctl launch "$DEVICE" dev.xcszh.fixture
          CONTAINER="$(xcrun simctl get_app_container "$DEVICE" dev.xcszh.fixture data)"
          for attempt in {1..45}; do
            if [ -f "$CONTAINER/Documents/result.json" ]; then break; fi
            sleep 2
          done
          cp "$CONTAINER/Documents/result.json" dist/FIXTURE_RESULTS.json
          cat dist/FIXTURE_RESULTS.json
          python3 -c 'import json; r=json.load(open("dist/FIXTURE_RESULTS.json")); assert r["passed"], r'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XCreatorStudioZH-v0.2
          path: dist/
          retention-days: 14
          if-no-files-found: error
